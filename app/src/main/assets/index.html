<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#090d18"><title>S1MPLE OS</title>
<style>
:root{--bg:#090d18;--panel:rgba(17,25,43,.78);--line:rgba(255,255,255,.12);--txt:#f3f6ff;--muted:#9aa8c3;--accent:#f5b942}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 75% 15%,#23365b 0,transparent 40%),radial-gradient(ellipse at 15% 85%,#173a43 0,transparent 45%),var(--bg);color:var(--txt);font:15px system-ui,-apple-system,sans-serif;height:100dvh;overflow:hidden}.desktop{height:100%;padding:24px 18px 88px;display:flex;flex-direction:column}.brand{font-size:12px;letter-spacing:4px;color:var(--muted);font-weight:700}.hero{margin:auto 0;text-align:center}.logo{font-size:clamp(42px,12vw,68px);font-weight:850;letter-spacing:-4px}.logo span{color:var(--accent)}.sub{color:var(--muted);letter-spacing:2px;font-size:11px}.clock{font-size:34px;font-weight:300;margin-top:22px}.date{color:var(--muted);font-size:13px}.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px auto 0;width:min(100%,430px)}.app{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:16px 8px;text-align:center;backdrop-filter:blur(16px);min-height:92px}.ico{font-size:25px;display:block;margin-bottom:7px}.app small{font-size:12px;color:#dce5f8}.dock{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:9px;background:rgba(13,20,35,.82);border:1px solid var(--line);border-radius:20px;backdrop-filter:blur(20px);max-width:calc(100% - 24px)}.dock button{border:0;background:transparent;color:white;font-size:23px;width:42px;height:42px;border-radius:13px}.dock button:active,.app:active{background:#35445f}.window{position:absolute;inset:14px 10px 76px;background:rgba(12,18,31,.96);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(20px);display:none;overflow:hidden;box-shadow:0 20px 70px #0009}.winhead{height:58px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-weight:700}.close{background:#29364e;border:0;color:white;border-radius:10px;padding:8px 12px}.content{padding:18px;overflow:auto;height:calc(100% - 58px)}.tile{padding:15px;background:#19243a;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}.muted{color:var(--muted)}input{width:100%;padding:13px;border-radius:12px;border:1px solid var(--line);background:#101a2b;color:white;margin:8px 0}button.action{padding:11px 14px;background:#dba83d;color:#151a24;border:0;border-radius:11px;font-weight:700}pre{white-space:pre-wrap;color:#bde6c9;background:#080d15;padding:14px;border-radius:12px;min-height:130px}.switch{float:right;accent-color:#e7b34b}.file{display:flex;gap:12px;align-items:center}.file b{font-size:20px}
</style></head><body>
<div class="desktop"><div class="brand">S1MPLE OS <span style="color:var(--accent)">/ ALPHA 1.0</span></div><div class="hero"><div class="logo">S1MPLE<span>.</span></div><div class="sub">YOUR SPACE. YOUR RULES.</div><div class="clock" id="clock">00:00</div><div class="date" id="date">Loading date</div><div class="apps">
<div class="app" onclick="openApp('Files')"><span class="ico">📁</span><small>Files</small></div><div class="app" onclick="openApp('Browser')"><span class="ico">🌐</span><small>Browser</small></div><div class="app" onclick="openApp('Settings')"><span class="ico">⚙️</span><small>Settings</small></div><div class="app" onclick="openApp('Gallery')"><span class="ico">🖼️</span><small>Gallery</small></div><div class="app" onclick="openApp('Terminal')"><span class="ico">⌨️</span><small>Terminal</small></div><div class="app" onclick="openApp('About')"><span class="ico">ⓘ</span><small>About</small></div>
</div></div></div>
<div class="dock"><button onclick="openApp('Files')">📁</button><button onclick="openApp('Browser')">🌐</button><button onclick="openApp('Settings')">⚙️</button><button onclick="openApp('Terminal')">⌨️</button></div>
<div class="window" id="win"><div class="winhead"><span id="title">App</span><button class="close" onclick="closeApp()">✕</button></div><div class="content" id="content"></div></div>
<script>
const $=id=>document.getElementById(id);function tick(){let d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});$('date').textContent=d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}tick();setInterval(tick,1000);
function openApp(name){$('title').textContent=name;$('win').style.display='block';let c=$('content');let pages={
Files:`<div class="tile file"><b>📁</b><div><strong>Documents</strong><div class="muted">Folder</div></div></div><div class="tile file"><b>🖼️</b><div><strong>Pictures</strong><div class="muted">Folder</div></div></div><div class="tile file"><b>⬇️</b><div><strong>Downloads</strong><div class="muted">Folder</div></div></div><p class="muted">Local demo file manager. Android storage access will be added later.</p>`,
Browser:`<p class="muted">S1MPLE Browser preview</p><input id="url" placeholder="Search or enter address"><button class="action" onclick="searchWeb()">Open</button><div id="browserMsg" class="tile" style="margin-top:14px">Enter a website address or search phrase.</div>`,
Settings:`<div class="tile">Appearance <span class="muted"> · Dark</span><input class="switch" type="checkbox" checked disabled></div><div class="tile">Accent color <span style="color:var(--accent)">● Gold</span></div><div class="tile">Version <span class="muted">1.0 Alpha</span></div><div class="tile">System status <span style="color:#8bd5a6">● Running</span></div>`,
Gallery:`<div class="tile">🖼️ Gallery is ready for its first pictures.</div><p class="muted">Photo picker integration is planned for a later build.</p>`,
Terminal:`<p class="muted">S1MPLE Shell · safe demo commands: help, date, clear, whoami</p><pre id="out">S1MPLE OS [Version 1.0-alpha]\nType 'help' to see commands.</pre><input id="cmd" placeholder="Enter command" onkeydown="if(event.key==='Enter')runCmd()"><button class="action" onclick="runCmd()">Run</button>`,
About:`<div class="logo" style="font-size:38px">S1MPLE<span>.</span></div><p>Your space. Your rules.</p><div class="tile">S1MPLE OS is an Android launcher-style desktop concept.</div><p class="muted">Build 1.0-alpha · Made for experimentation</p>`};c.innerHTML=pages[name]||''}
function closeApp(){$('win').style.display='none'}function searchWeb(){let v=$('url').value.trim();if(!v)return;let u=/^https?:\/\//i.test(v)?v:'https://www.google.com/search?q='+encodeURIComponent(v);let box=$('browserMsg');box.textContent='External pages open in your browser for this alpha build. ';let a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';a.textContent='Continue';a.style.color='#f5b942';box.appendChild(a)}
function runCmd(){let el=$('cmd'),out=$('out');if(!el||!out)return;let x=el.value.trim(),r={help:'Available commands: help, date, whoami, clear',whoami:'guest@s1mple-os',date:new Date().toString(),clear:''}[x]??('Command not found: '+x);out.textContent+='\n> '+x+(x==='clear'?'':'\n'+r);el.value='';}
</script></body></html>
